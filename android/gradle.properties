# Memory caps: on 2026-11-07 the first build (2 GB Gradle heap + Kotlin daemon) ran next to Ollama's
# generation with swap already full, and the laptop froze. Never build while generate.py runs.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.workers.max=4
android.useAndroidX=true
